<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      No remote container tags here any more, and their absence is the point.

      There used to be seven, blocking, in this element: `remotes` in `webpack.config.js` named each
      remote by the bare global its `library: { type: 'var' }` defines, so the global had to exist
      before single-spa could import from it. The cost was paid on every route — the visitor
      downloaded and executed all seven containers before the shell ran, whether or not the route
      needed them — and a single remote being unreachable took the whole document down with it,
      before any error handler existed to say so.

      They are now declared as `name@url` in `webpack.config.js`, which is webpack's own lazy form:
      the container script is injected at the first `import('nav/Header')`. One of the seven was the
      shell fetching its *own* container from :3001, which exposes nothing.

      What that buys, in order of how much it matters: a remote is downloaded only on a route that
      mounts it; a failed remote is a rejected `import()` that `src/index.ts` answers with a fallback
      region rather than a blank page; and the port map lives in one file instead of two.
    -->
  </head>
  <body>
    <!--
      Mount points, in DOM order. single-spa renders each application into
      `#single-spa-application:NAME`, and appends its own div to `<body>` for any application
      without one — which is how a remote ends up outside the layout entirely.

      `auth` is deliberately outside `.mm-container`: it is a vertical split that owns the whole
      viewport, and the shell's chrome is switched off on its routes (`exceptRoutes` in
      `src/routes.ts`).
    -->
    <div id="single-spa-application:auth"></div>

    <div class="mm-container">
      <div id="single-spa-application:header"></div>

      <!--
        The main landmark, and the target of the header's "skip to content" link (nav names the id
        as `MAIN_LANDMARK_ID`, so the contract is written down on both sides). It belongs to the
        shell because the shell owns the composition: which fragments count as "the content" is a
        layout decision, and no single remote can see enough of the page to declare it.

        `tabindex="-1"` is what makes the skip link actually work. Following a fragment link scrolls
        to the target but moves focus only if the target is focusable, so without this a keyboard
        user lands visually on the content while the next Tab returns them to the second nav link.
      -->
      <main id="mm-main" tabindex="-1">
        <!--
          The horizontal split, active on `/examination`: the Angular examination form across three
          quarters of the screen with the Vue 3 ICD-10 catalogue in the remaining quarter. Two
          independently deployed micro-frontends — different frameworks, different ports, no shared
          build — composed onto one screen and talking only over the event bus
          (`ICD10_DISEASE_SELECTED`). Neither imports the other, and neither *can*: Angular cannot
          import a Vue component, which is what makes the browser the only possible integration point
          here rather than merely the chosen one.

          `.mm-split` and its `--primary` modifier are design-system layout utilities, not
          shell-local classes: composing fragments is the shell's job, but the vocabulary it does it
          with is shared. The 3:1 ratio lives there, in one place, rather than in either remote —
          a fragment renders into its own mount point and cannot see the screen it shares, so
          whichever one shipped the ratio would be imposing a layout on a sibling it cannot observe.

          Order is the composition. `.mm-split--primary` makes the *first* child the wide column, so
          examination precedes icd10 here — which also puts them in that order for reading and for
          Tab, matching what the doctor does: fill in the form, reach for the catalogue when the
          diagnosis is needed.
        -->
        <div class="mm-split mm-split--primary mm-region">
          <div id="single-spa-application:examination"></div>
          <div id="single-spa-application:icd10"></div>
        </div>

        <div id="single-spa-application:calendar" class="mm-region"></div>
      </main>

      <div id="single-spa-application:footer"></div>
    </div>

    <!--
      The notification layer, last in the document and outside `.mm-container` on purpose: its
      region is `position: fixed`, so it is positioned against the viewport rather than this
      element, and the container's `max-width` would otherwise be inherited for nothing.

      Unlike the header and footer it is active on *every* route including `/login` — a failed
      sign-in has to be able to say so. That difference in route contract is why it is its own
      micro-frontend on :3007 rather than a third application inside `nav`.
    -->
    <div id="single-spa-application:notifications"></div>
  </body>
</html>
