<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Examination MFE — standalone</title>
    <!--
      remoteEntry.js is NOT loaded here. This page is the standalone dev harness: webpack's own
      bundle is injected by HtmlWebpackPlugin, and pulling in remoteEntry.js as well would
      evaluate the container a second time. (The previous version of this file loaded the *shell's*
      container from :3001, which meant the harness could not run without the shell.)
    -->
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      .harness {
        display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        min-height: 48px; padding: 8px 16px; box-sizing: border-box;
        background: #0f3460; color: #fff; font-size: 13px;
      }
      .harness button { font: inherit; }
      /*
        The 3/4–1/4 split the shell composes, reproduced so the form is developed at the width it
        actually ships at. A form built full-bleed and then dropped into three quarters of a column
        is a form whose layout was never really tested.

        Harness CSS, not the shell's: `.mm-split--primary` in the design system is the real rule.
        The ratio is restated here rather than imported precisely so this page cannot become a
        second place that *defines* the layout.
      */
      .harness-split {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        padding: 16px;
      }
      .harness-icd10 {
        padding: 12px;
        border: 1px dashed #94a3b8;
        border-radius: 8px;
        font-size: 13px;
        color: #475569;
      }
      #examination-diseases { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="harness">
      <span>Examination MFE (standalone)</span>
      <span id="examination-last-event"></span>
    </div>

    <div class="harness-split">
      <!-- The wide pane: this micro-frontend, at the 3/4 width the shell gives it. -->
      <div id="examination-root"></div>

      <!--
        The narrow pane stands in for the `icd10` remote, which is not running here. It publishes the
        same `ICD10_DISEASE_SELECTED` event on the same shared bus, so the diagnosis pane cannot tell
        the difference — which is exactly the property the split is supposed to have. The buttons are
        built in `standalone.ts` from real ICD-10 codes, because the backend rejects a diagnosis code
        that is not in the seeded `disease` table.
      -->
      <aside class="harness-icd10">
        <strong>ICD-10 stand-in</strong>
        <p>The real remote is on :3002. These publish the same bus event.</p>
        <div id="examination-diseases"></div>
      </aside>
    </div>
  </body>
</html>
