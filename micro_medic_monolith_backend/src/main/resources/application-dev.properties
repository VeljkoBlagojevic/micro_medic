spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false

server.error.include-message=always

app.jwt.secret=${JWT_SECRET:}

# The federation ports, and nothing else: each micro-frontend's dev harness calls the API from its
# own origin. 3005 was dropped with the `shared_store` remote — it serves nothing now.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3006,http://localhost:3007,http://localhost:3009}