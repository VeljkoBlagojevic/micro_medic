spring.application.name=micro_medic_monolith_backend

# Safe default; dev overrides in application-dev.properties
server.error.include-message=never

# Active profile (override via environment variable SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

## MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/micro_medic_monolith_backend?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_ROOT_USERNAME:}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Fail startup on a misnamed migration instead of ignoring it. Flyway's default is to silently
# skip any file that does not match `V<version>__<description>.sql`, which is how
# V6_fix_diagnosis_and_medicine_constraints.sql (one underscore) sat in the folder never having
# run: no error, no log line, and `ddl-auto=validate` still passed because the entities matched
# the *pre*-V6 schema. A typo'd filename should break the build, not the database.
spring.flyway.validate-migration-naming=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

management.endpoints.web.exposure.include=health,info,metrics,loggers,httptrace
management.endpoint.health.show-details=when-authorized

spring.cache.type=simple